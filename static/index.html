<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apple TV Remote</title>
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apple TV Remote" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #13171d;
      --panel2: #1c222b;
      --text: #ffffff;
      --muted: #8b97a8;
      --line: #2d3542;
      --key: #1e242d;
      --key-hi: #2a313c;
      --accent: #5ac8fa;
      --accent2: #007aff;
      --ok: #32d74b;

      --remote-bg: linear-gradient(180deg, #1a1f27, #12151a);
      --remote-border: var(--line);
      --remote-shadow: 0 18px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
      --dpad-bg: radial-gradient(circle at 50% 45%, #2a313c, #171b21 70%);
      --dpad-shadow: inset 0 2px 8px rgba(0,0,0,0.55), 0 8px 20px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.05);
      --select-bg: linear-gradient(160deg, #3a4452, #232933);
      --select-shadow: 0 4px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
      --select-active: linear-gradient(160deg, var(--accent2), #0055aa);
      --power-bg: #1e242d;
      --power-border: rgba(255,255,255,0.1);
      --power-text: #8b97a8;
      --power-shadow: 0 2px 8px rgba(0,0,0,0.4);
      --dir-dot: #8b97a8;
      --siri-btn-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    :root.light {
      --bg: #e2e4e8;
      --panel: #f2f2f7;
      --panel2: #ffffff;
      --text: #000000;
      --muted: #8e8e93;
      --line: #c7c7cc;
      --key: #1c1c1e;
      --key-hi: #121214;
      --accent: #007aff;

      --remote-bg: linear-gradient(180deg, #e4e5e7, #d2d4d8);
      --remote-border: #bcc0c5;
      --remote-shadow: 0 25px 50px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.8);
      --dpad-bg: #1c1c1e;
      --dpad-shadow: inset 0 1px 4px rgba(255,255,255,0.1), 0 8px 16px rgba(0,0,0,0.15);
      --select-bg: #141414;
      --select-shadow: inset 0 4px 8px rgba(0,0,0,0.6), 0 0 0 1px #000, 0 1px 1px rgba(255,255,255,0.1);
      --select-active: #0a0a0c;
      --power-bg: linear-gradient(180deg, #f0f1f3, #e1e3e6);
      --power-border: #b5b8bc;
      --power-text: #333;
      --power-shadow: 0 2px 6px rgba(0,0,0,0.1), inset 0 1px 2px rgba(255,255,255,0.9);
      --dir-dot: #fff;
      --siri-btn-shadow: inset 0 -2px 4px rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.8);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); touch-action: manipulation; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 40% at 50% 0%, #152033 0%, transparent 55%),
        var(--bg);
      display: flex; flex-direction: column; align-items: center;
      padding: 1.5rem 1rem 2rem;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }
    .wrap { width: 100%; max-width: 360px; }

    .remote {
      background: var(--remote-bg);
      border: 1px solid var(--remote-border);
      border-radius: 40px;
      padding: 1.5rem 1.25rem 2rem;
      margin-bottom: 0.75rem;
      box-shadow: var(--remote-shadow);
      position: relative;
    }
    .remote-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 1.1rem;
    }
    .title {
      display: none; /* Hide title to look like the real remote */
    }
    .now-playing {
      margin-top: 2px; font-size: 0.72rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 200px; min-height: 0;
    }
    .now-playing:empty { display: none; }
    .dot {
      width: 10px; height: 3px; border-radius: 2px;
      background: #111;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.4);
      flex-shrink: 0;
      position: absolute; top: 1.8rem; left: 50%; transform: translateX(-50%);
    }
    .dot.on { background: #32d74b; box-shadow: 0 0 6px #32d74b; }
    .dot.warn { background: #ffd60a; box-shadow: 0 0 6px #ffd60a; }

    /* Power button — top-right corner */
    .power-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--power-border);
      background: var(--power-bg);
      color: var(--power-text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.2s ease;
      box-shadow: var(--power-shadow);
      position: absolute; top: 1rem; right: 1rem;
    }
    .power-btn:active { transform: scale(0.92); }
    .power-btn.on {
      border-color: #32d74b;
      color: #32d74b;
      box-shadow: 0 0 10px rgba(50,215,75,0.4), 0 2px 8px rgba(0,0,0,0.4);
    }
    .power-btn.off {
      border-color: #ff453a;
      color: #ff453a;
      box-shadow: 0 0 10px rgba(255,69,58,0.35), 0 2px 8px rgba(0,0,0,0.4);
    }
    
    /* Hold-to-sleep fill ring */
    .power-btn .hold-ring {
      position: absolute; inset: -4px;
      border-radius: 50%; pointer-events: none;
    }
    .power-btn .hold-ring circle {
      fill: none; stroke: #ff453a; stroke-width: 3;
      stroke-dasharray: 132; stroke-dashoffset: 132;
      stroke-linecap: round;
      transform: rotate(-90deg); transform-origin: center;
    }
    .power-btn.holding .hold-ring circle {
      transition: stroke-dashoffset 0.6s linear;
      stroke-dashoffset: 0;
    }
    .power-btn-wrap {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }

    .dpad {
      width: 260px; height: 260px; margin: 3rem auto 1.5rem;
      position: relative;
      border-radius: 50%;
      background: var(--dpad-bg);
      box-shadow: var(--dpad-shadow);
    }
    .dir {
      position: absolute; width: 70px; height: 70px;
      border: none; border-radius: 50%; cursor: pointer;
      background: transparent; color: transparent;
      display: flex; align-items: center; justify-content: center;
    }
    .dir::after {
      content: ''; display: block; width: 4px; height: 4px;
      background: var(--dir-dot); border-radius: 50%; opacity: 0.6;
    }
    .dir:active, .dir.pressed {
      background: rgba(90,200,250,0.12);
    }
    .dir.up { top: 4px; left: 50%; transform: translateX(-50%); }
    .dir.down { bottom: 4px; left: 50%; transform: translateX(-50%); }
    .dir.left { left: 4px; top: 50%; transform: translateY(-50%); }
    .dir.right { right: 4px; top: 50%; transform: translateY(-50%); }
    .select {
      position: absolute; top: 50%; left: 50%;
      width: 120px; height: 120px; margin: -60px 0 0 -60px;
      border: none; border-radius: 50%; cursor: pointer;
      background: var(--select-bg);
      color: transparent;
      box-shadow: var(--select-shadow);
    }
    .select:active, .select.pressed {
      background: var(--select-active);
    }

    /* Siri Remote Bottom Buttons */
    .siri-buttons {
      display: grid;
      grid-template-columns: 76px 76px;
      grid-template-rows: 76px 76px 76px;
      gap: 20px;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .siri-btn {
      width: 76px; height: 76px; border-radius: 50%;
      background: var(--key); color: #fff; border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: var(--siri-btn-shadow);
      transition: transform 0.1s;
    }
    .siri-btn:active, .siri-btn.pressed { transform: scale(0.95); background: var(--key-hi); color: var(--accent); }
    
    .siri-vol-pill {
      grid-column: 2;
      grid-row: 2 / span 2;
      width: 76px; height: 172px;
      border-radius: 38px;
      background: var(--key); border: 1px solid var(--line);
      display: flex; flex-direction: column;
      box-shadow: var(--siri-btn-shadow);
      overflow: hidden;
    }
    .siri-vol-pill .vol {
      width: 100%; height: 50%; border: none; background: transparent; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 300; cursor: pointer; transition: background 0.1s;
    }
    .siri-vol-pill .vol:active, .siri-vol-pill .vol.pressed { background: var(--key-hi); color: var(--accent); }
    
    /* App Drawer Grid */
    .apps-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .app-btn {
      height: 48px; border-radius: 12px; cursor: pointer;
      background: var(--key); color: #fff; border: 1px solid var(--line);
      font-family: inherit; font-weight: 700; font-size: 0.75rem;
      transition: background 0.15s;
    }
    .app-btn:active { background: var(--key-hi); color: var(--accent); }

    /* Inline kb (auto-opens when TV keyboard is focused) — hidden, kept for JS compat */
    .kb { display: none; }
    .kb.open { display: none; } /* we use the drawer instead */
    .kb-row { display: flex; gap: 8px; }
    .kb-row input {
      flex: 1; min-width: 0; border-radius: 12px; border: 1px solid var(--line);
      background: #0e1116; color: var(--text); font-size: 1rem;
      font-family: inherit; font-weight: 600;
      padding: 11px 12px; outline: none;
      user-select: text; -webkit-user-select: text;
    }
    .kb-row input:focus { border-color: var(--accent); }
    .kb-row .btn-sm { flex: 0 0 auto; padding-inline: 16px; }

    .drawer {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px 12px 4px;
      margin-bottom: 0.55rem;
    }
    .drawer-toggle {
      width: 100%; display: flex; align-items: center; gap: 8px;
      background: none; border: none; color: var(--muted);
      font-family: inherit; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 1.1px; text-transform: uppercase;
      cursor: pointer; text-align: left; padding: 10px 0;
    }
    .drawer-toggle .chevron { display: inline-block; transition: transform .18s; font-size: 0.7rem; }
    .drawer-toggle.open .chevron { transform: rotate(90deg); }
    .drawer-body { display: none; padding-bottom: 10px; }
    .drawer-body.open { display: block; }
    .drawer .row { margin-bottom: 0; }

    .conn-card {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px 12px 4px;
    }
    .conn-toggle {
      width: 100%; display: flex; align-items: center; gap: 8px;
      background: none; border: none; color: var(--muted);
      font-family: inherit; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 1.1px; text-transform: uppercase;
      cursor: pointer; text-align: left; padding: 10px 0;
    }
    .conn-toggle .chevron { display: inline-block; transition: transform .18s; font-size: 0.7rem; }
    .conn-toggle.open .chevron { transform: rotate(90deg); }
    .conn-toggle-sub {
      text-transform: none; letter-spacing: 0; font-weight: 600;
      color: var(--text); opacity: 0.75; margin-left: 2px;
      max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #conn-body { display: none; padding-bottom: 10px; }
    #conn-body.open { display: block; }

    .conn-meta {
      font-size: 0.72rem; color: var(--muted); margin-bottom: 10px;
      font-family: 'IBM Plex Mono', monospace;
    }
    .status-actions { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-sm {
      flex: 1; border: none; border-radius: 10px; cursor: pointer;
      font-family: inherit; font-weight: 700; font-size: 0.78rem;
      padding: 10px 12px;
      background: var(--key); color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-sm:active { transform: scale(0.97); background: var(--key-hi); }
    .btn-sm.primary {
      background: linear-gradient(135deg, var(--accent2), #0066cc);
      border-color: transparent; color: #fff;
    }
    .btn-sm:disabled { opacity: 0.45; cursor: not-allowed; }

    .pair-help { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
    .device-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; max-height: 180px; overflow-y: auto; }
    .device {
      text-align: left; border: 1px solid var(--line); border-radius: 12px;
      background: var(--panel2); color: var(--text); padding: 11px 12px;
      cursor: pointer; font-family: inherit;
    }
    .device.selected { border-color: rgba(90,200,250,0.45); }
    .device .n { font-weight: 800; font-size: 0.9rem; }
    .device .m { font-size: 0.7rem; color: var(--muted); margin-top: 3px; font-family: 'IBM Plex Mono', monospace; }
    .pin-row { display: flex; gap: 8px; }
    .pin-row input {
      flex: 1; border-radius: 12px; border: 1px solid var(--line);
      background: #0e1116; color: var(--text); font-size: 1.15rem;
      font-family: 'IBM Plex Mono', monospace; font-weight: 600;
      letter-spacing: 4px; text-align: center; padding: 11px;
      outline: none; user-select: text; -webkit-user-select: text;
    }
    .pin-row input:focus { border-color: var(--accent); }

    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #1c222b; color: var(--text); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 16px; font-size: 0.8rem; font-weight: 600;
      z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="remote">
      <!-- Theme toggle in top left -->
      <button onclick="document.documentElement.classList.toggle('light')" style="position:absolute;top:1rem;left:1rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.2rem;" aria-label="Toggle Theme">◐</button>
      
      <div class="remote-top">
        <div style="min-width:0">
          <div class="title">Apple TV Remote</div>
          <div class="now-playing" id="now-playing"></div>
        </div>
      </div>
      
      <span class="dot" id="dot" title="Connection"></span>
      <button class="power-btn" id="btn-power" type="button" title="Tap to wake · Hold to sleep" aria-label="Power">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
        <svg class="hold-ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21"/></svg>
      </button>

      <div class="dpad">
        <button class="dir up" data-action="up" aria-label="Up"></button>
        <button class="dir left" data-action="left" aria-label="Left"></button>
        <button class="select" data-action="select"></button>
        <button class="dir right" data-action="right" aria-label="Right"></button>
        <button class="dir down" data-action="down" aria-label="Down"></button>
      </div>

      <div class="siri-buttons">
        <button class="siri-btn" data-action="menu" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="siri-btn" data-action="home" aria-label="TV">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="8" y1="18" x2="16" y2="18"></line></svg>
        </button>
        <button class="siri-btn" data-action="play_pause" aria-label="Play Pause">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 6v12l8-6-8-6z M16 6h2v12h-2z"/></svg>
        </button>
        <div class="siri-vol-pill">
          <button class="vol" data-action="volume_up" aria-label="Volume up">+</button>
          <button class="vol" data-action="volume_down" aria-label="Volume down">−</button>
        </div>
        <button class="siri-btn" data-action="mute" aria-label="Mute">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>
      </div>

      <!-- hidden kb kept for JS compat with auto-focus detection -->
      <div class="kb" id="kb">
        <div class="kb-row">
          <input id="kb-input" type="text" enterkeyhint="send" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type…" />
          <button class="btn-sm primary" type="button" onclick="sendKeyboard()">Send</button>
        </div>
      </div>
    </div>

    <!-- Keyboard drawer -->
    <section class="drawer" aria-label="Keyboard">
      <button class="drawer-toggle" id="kb-toggle" type="button" onclick="toggleKbDrawer()">
        <span class="chevron">▸</span> Keyboard
      </button>
      <div class="drawer-body" id="kb-drawer-body">
        <div class="kb-row">
          <input id="kb-drawer-input" type="text" enterkeyhint="send" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type to search…" />
          <button class="btn-sm primary" type="button" onclick="sendKeyboardDrawer()">Send</button>
        </div>
      </div>
    </section>

    <!-- Apps drawer -->
    <section class="drawer" aria-label="Apps">
      <button class="drawer-toggle" id="apps-toggle" type="button" onclick="toggleApps()">
        <span class="chevron">▸</span> Apps
      </button>
      <div class="drawer-body" id="apps-body">
        <div class="apps-grid">
          <button class="app-btn" onclick="launchApp('com.google.ios.youtube')">YouTube</button>
          <button class="app-btn" onclick="launchApp('com.netflix.Netflix')">Netflix</button>
          <button class="app-btn" onclick="launchApp('com.disney.disneyplus')">Disney+</button>
          <button class="app-btn" onclick="launchApp('com.amazon.aiv.AIVApp')">Prime</button>
          <button class="app-btn" onclick="launchApp('com.hulu.plus')">Hulu</button>
          <button class="app-btn" onclick="launchApp('com.apple.tv')">Apple TV</button>
        </div>
      </div>
    </section>

    <section class="conn-card" aria-label="Connection">
      <button class="conn-toggle" id="conn-toggle" onclick="toggleConn()">
        <span class="chevron">▸</span> Connection
        <span class="conn-toggle-sub" id="conn-toggle-sub"></span>
      </button>
      <div id="conn-body">
        <div class="conn-meta" id="addr-label">—</div>
        <div class="status-actions">
          <button class="btn-sm" onclick="scanDevices()">Scan</button>
          <button class="btn-sm primary" onclick="connectDevice()">Connect</button>
        </div>
        <p class="pair-help" id="pair-help">Scan the LAN, pick your office Apple TV, then enter the PIN shown on the TV.</p>
        <div class="device-list" id="device-list"></div>
        <div class="status-actions">
          <button class="btn-sm primary" id="pair-start-btn" onclick="startPair()" disabled>Start pairing</button>
        </div>
        <div class="pin-row" id="pin-row" style="display:none">
          <input id="pin-input" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="one-time-code" />
          <button class="btn-sm primary" style="flex:0 0 auto;padding-inline:18px" onclick="finishPair()">Pair</button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
  let selectedId = null;
  let busy = false;
  let autoConnecting = false;
  let lastPaired = false;
  let kbForced = false;

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function toggleApps() {
    const body = document.getElementById('apps-body');
    const toggle = document.getElementById('apps-toggle');
    const open = body.classList.toggle('open');
    toggle.classList.toggle('open', open);
  }

  function toggleKbDrawer() {
    const body = document.getElementById('kb-drawer-body');
    const toggle = document.getElementById('kb-toggle');
    const open = body.classList.toggle('open');
    toggle.classList.toggle('open', open);
    if (open) {
      setTimeout(() => document.getElementById('kb-drawer-input').focus(), 80);
    }
  }

  async function sendKeyboardDrawer() {
    const input = document.getElementById('kb-drawer-input');
    try {
      await api('/api/keyboard', {
        method: 'POST',
        body: JSON.stringify({ text: input.value, mode: 'set' }),
      });
      toast('Sent');
    } catch (e) {
      toast(e.message);
      if (lastPaired) autoReconnect();
    }
  }

  let powerState = null; // 'on' | 'off' | null

  function setPowerBtn(state) {
    powerState = state;
    const btn = document.getElementById('btn-power');
    btn.classList.remove('on', 'off');
    if (state === 'on') btn.classList.add('on');
    else if (state === 'off') btn.classList.add('off');
  }

  // Hold-to-sleep / tap-to-wake logic for power button
  let holdTimer = null;
  let holdFired = false;

  function powerHoldStart() {
    holdFired = false;
    const btn = document.getElementById('btn-power');
    if (powerState === 'on') {
      // Start the hold ring animation
      btn.classList.add('holding');
      holdTimer = setTimeout(async () => {
        holdFired = true;
        btn.classList.remove('holding');
        if (!busy) {
          await power('sleep');
          setPowerBtn('off');
        }
      }, 600);
    }
  }

  function powerHoldEnd() {
    const btn = document.getElementById('btn-power');
    clearTimeout(holdTimer);
    btn.classList.remove('holding');
    if (!holdFired && powerState !== 'on') {
      // Quick tap → wake
      (async () => {
        if (!busy) {
          await power('wake');
          setPowerBtn('on');
        }
      })();
    }
  }

  (function initPowerBtn() {
    const btn = document.getElementById('btn-power');
    btn.addEventListener('mousedown', (e) => { e.preventDefault(); powerHoldStart(); });
    btn.addEventListener('mouseup', powerHoldEnd);
    btn.addEventListener('mouseleave', powerHoldEnd);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); powerHoldStart(); }, { passive: false });
    btn.addEventListener('touchend', powerHoldEnd);
    btn.addEventListener('touchcancel', powerHoldEnd);
  })();

  function toggleConn() {
    const body = document.getElementById('conn-body');
    const toggle = document.getElementById('conn-toggle');
    const open = body.classList.toggle('open');
    toggle.classList.toggle('open', open);
    if (open && !document.getElementById('device-list').children.length) scanDevices();
  }

  function setKeyboardOpen(open) {
    document.getElementById('kb').classList.toggle('open', open);
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      ...opts,
    });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const detail = (data && (data.detail || data.message)) || res.statusText;
      throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    }
    return data;
  }

  function setConn(connected, paired) {
    const dot = document.getElementById('dot');
    const sub = document.getElementById('conn-toggle-sub');
    lastPaired = !!paired;
    dot.className = 'dot' + (connected ? ' on' : paired ? ' warn' : '');
    dot.title = connected ? 'Connected' : paired ? 'Paired · offline' : 'Not paired';
    sub.textContent = connected ? '· connected' : paired ? '· offline' : '· setup';
    // Reflect connection in power button
    if (connected && powerState === null) setPowerBtn('on');
    else if (!connected && !paired && powerState === null) setPowerBtn('off');
  }

  function setKeyboardFocus(kb) {
    const focused = !!(kb && /Focused/i.test(String(kb.focus || '')));
    if (focused) {
      setKeyboardOpen(true);
      if (kb.text != null && document.activeElement !== document.getElementById('kb-input')) {
        document.getElementById('kb-input').value = kb.text;
      }
    } else if (!kbForced) {
      setKeyboardOpen(false);
    }
  }

  async function autoReconnect() {
    if (autoConnecting || !lastPaired) return;
    autoConnecting = true;
    try {
      await api('/api/connect', { method: 'POST', body: '{}' });
      await refreshStatus({ skipAuto: true });
    } catch (_) {
    } finally {
      autoConnecting = false;
    }
  }

  async function refreshStatus(opts = {}) {
    try {
      const d = await api('/api/status');
      setConn(d.connected, d.paired);
      document.getElementById('addr-label').textContent =
        [d.device_name, d.address].filter(Boolean).join(' · ') || '—';
      const p = d.playing;
      const np = document.getElementById('now-playing');
      const appName = (p && p.app) || d.current_app || '';
      const hasNp = !!(p && (p.title || p.app)) || !!d.current_app;
      if (hasNp) {
        np.textContent = [appName, p && p.title, p && p.artist].filter(Boolean).join(' · ');
      } else {
        np.textContent = '';
      }
      setKeyboardFocus(d.keyboard);
      if (d.identifier) selectedId = d.identifier;
      if (!d.paired && !d.connected) {
        document.getElementById('conn-body').classList.add('open');
        document.getElementById('conn-toggle').classList.add('open');
      }
      // Update power button from playing/power state if available
      const ps = d.power_state || '';
      if (ps.includes('On') || d.connected) setPowerBtn('on');
      else if (ps.includes('Standby') || ps.includes('Off')) setPowerBtn('off');
      if (!opts.skipAuto && d.paired && !d.connected) autoReconnect();
    } catch (e) {
      setConn(false, lastPaired);
    }
  }

  async function scanDevices() {
    const list = document.getElementById('device-list');
    list.innerHTML = '<div class="m" style="color:var(--muted);padding:8px">Scanning…</div>';
    document.getElementById('conn-body').classList.add('open');
    document.getElementById('conn-toggle').classList.add('open');
    try {
      const d = await api('/api/scan');
      if (!d.devices.length) {
        list.innerHTML = '<div class="m" style="color:var(--muted);padding:8px">No devices found</div>';
        return;
      }
      list.innerHTML = d.devices.map(dev => `
        <button class="device${dev.identifier === selectedId ? ' selected' : ''}" data-id="${dev.identifier}" onclick="selectDevice('${dev.identifier}', this)">
          <div class="n">${esc(dev.name || 'Apple TV')}${dev.has_companion ? '' : ' · limited'}</div>
          <div class="m">${esc(dev.address || '')} · ${esc((dev.protocols || []).join(', '))}</div>
        </button>
      `).join('');
      toast(`Found ${d.count} device${d.count === 1 ? '' : 's'}`);
    } catch (e) {
      list.innerHTML = '';
      toast(e.message);
    }
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function selectDevice(id, el) {
    selectedId = id;
    document.querySelectorAll('.device').forEach(b => b.classList.remove('selected'));
    if (el) el.classList.add('selected');
    document.getElementById('pair-start-btn').disabled = !id;
  }

  async function startPair() {
    if (!selectedId) return toast('Pick a device first');
    try {
      const d = await api('/api/pair/start', { method: 'POST', body: JSON.stringify({ identifier: selectedId }) });
      document.getElementById('pin-row').style.display = 'flex';
      document.getElementById('pair-help').textContent = `PIN should appear on ${d.name}. Enter it below.`;
      document.getElementById('pin-input').focus();
      toast('Enter PIN from TV');
    } catch (e) {
      toast(e.message);
    }
  }

  async function finishPair() {
    const pin = document.getElementById('pin-input').value.trim();
    if (!pin) return toast('Enter the PIN');
    try {
      const d = await api('/api/pair/finish', { method: 'POST', body: JSON.stringify({ pin }) });
      toast(d.message || 'Paired');
      document.getElementById('pin-row').style.display = 'none';
      document.getElementById('pin-input').value = '';
      await refreshStatus({ skipAuto: true });
    } catch (e) {
      toast(e.message);
    }
  }

  async function connectDevice() {
    try {
      const d = await api('/api/connect', { method: 'POST', body: '{}' });
      toast(d.name ? `Connected · ${d.name}` : 'Connected');
      await refreshStatus({ skipAuto: true });
    } catch (e) {
      toast(e.message);
    }
  }

  // Wake the TV silently if it's off, then wait for it to respond
  async function wakeIfNeeded() {
    if (powerState !== 'off') return;
    try {
      await api('/api/power', { method: 'POST', body: JSON.stringify({ action: 'wake' }) });
      setPowerBtn('on');
      toast('Waking…');
      await new Promise(r => setTimeout(r, 1200));
    } catch (_) {}
  }

  async function send(action, btn) {
    if (busy) return;
    busy = true;
    if (btn) btn.classList.add('pressed');
    try {
      await wakeIfNeeded();
      await api('/api/remote/' + action, { method: 'POST', body: '{}' });
    } catch (e) {
      toast(e.message);
      if (lastPaired) autoReconnect();
    } finally {
      if (btn) btn.classList.remove('pressed');
      busy = false;
    }
  }

  async function launchApp(bundleId) {
    if (busy) return;
    busy = true;
    try {
      await wakeIfNeeded();
      await api('/api/launch/' + encodeURIComponent(bundleId), { method: 'POST', body: '{}' });
      toast('Opening app...');
      setTimeout(() => refreshStatus({ skipAuto: true }), 800);
    } catch (e) {
      toast(e.message);
      if (lastPaired) autoReconnect();
    } finally {
      busy = false;
    }
  }

  async function power(action) {
    if (busy) return;
    busy = true;
    try {
      await api('/api/power', { method: 'POST', body: JSON.stringify({ action }) });
      toast(action === 'wake' || action === 'on' ? 'Waking…' : 'Sleeping…');
      setTimeout(() => refreshStatus({ skipAuto: true }), 1000);
    } catch (e) {
      toast(e.message);
      if (lastPaired) autoReconnect();
    } finally {
      busy = false;
    }
  }

  async function sendKeyboard() {
    const input = document.getElementById('kb-input');
    try {
      await api('/api/keyboard', {
        method: 'POST',
        body: JSON.stringify({ text: input.value, mode: 'set' }),
      });
      toast('Sent');
    } catch (e) {
      toast(e.message);
      if (lastPaired) autoReconnect();
    }
  }

  document.querySelectorAll('[data-action]').forEach(btn => {
    const fire = (e) => { e.preventDefault(); send(btn.dataset.action, btn); };
    btn.addEventListener('click', fire);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); send(btn.dataset.action, btn); }, { passive: false });
  });



  document.getElementById('kb-drawer-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendKeyboardDrawer(); }
  });

  document.getElementById('pin-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') finishPair();
  });
  document.getElementById('kb-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendKeyboard(); }
  });

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const map = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      Enter: 'select', Escape: 'menu', Backspace: 'menu',
      ' ': 'play_pause',
    };
    if (map[e.key]) { e.preventDefault(); send(map[e.key]); }
  });

  refreshStatus();
  setInterval(refreshStatus, 5000);
</script>
</body>
</html>
